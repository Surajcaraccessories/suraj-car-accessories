<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suraj Car Accessories</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f4f4f4; }
        header { background: #333; color: white; padding: 15px; text-align: center; }
        .product-grid { display: flex; gap: 20px; margin-top: 20px; flex-wrap: wrap; }
        .card { background: white; padding: 15px; border-radius: 8px; width: 200px; text-align: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        button { background: #28a745; color: white; border: none; padding: 8px 12px; cursor: pointer; border-radius: 4px; }
    </style>
</head>
<body>

    <header>
        <h1>Suraj Car Accessories</h1>
    </header>

    <div class="product-grid">
        <div class="card">
            <h3>Car Seat Cover</h3>
            <p>Price: ₹1,499</p>
            <button>Buy Now</button>
        </div>
        <div class="card">
            <h3>LED Headlight</h3>
            <p>Price: ₹999</p>
            <button>Buy Now</button>
        </div>
    </div>

</body>
</html>
